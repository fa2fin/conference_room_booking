{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
  <h2>New Booking for {{ room.name }}</h2>
  <div class="row">
    <div class="col-md-6">
      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="form-group">
          <button type="submit" class="btn btn-primary">Confirm Booking</button>
          <a href="{% url 'rooms:detail' room.id %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
