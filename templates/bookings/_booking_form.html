{% load crispy_forms_tags %}
<form method="POST">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary mt-3">Подтвердить</button>
  <a href="{% url 'rooms:detail' room.id %}" class="btn btn-secondary mt-3">Отмена</a>
</form>

<!-- Вывод ошибок -->
{% if form.errors %}
  <div class="alert alert-danger mt-3">
    {% for field, errors in form.errors.items %}
      {% for error in errors %}
        <p>{{ error }}</p>
      {% endfor %}
    {% endfor %}
  </div>
{% endif %}
